<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NorSand Lab</title>
  <link href="https://fonts.googleapis.com/css?family=Inclusive+Sans&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css?family=Inter:400,700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css?family=JetBrains+Mono&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css?family=Roboto+Serif&display=swap" rel="stylesheet" />
  <link href="css/main.css" rel="stylesheet" />
</head>
<body>

  <header class="site-header">
    <div class="site-header__inner">
      <span class="site-header__logo">NorSand Lab</span>
      <nav class="site-header__nav">
        <a href="./index.html">Learn</a>
        <a href="./visualization.html">Visualizations</a>
      </nav>
    </div>
  </header>

  <div class="layout">

    <aside class="sidebar">
      <nav class="sidebar__nav" aria-label="Page sections">
      <form>
        <p class="sidebar__eyebrow">Critical State Line Parameters</p>
          <table class="sidebar__table">
            <tr>
              <td>Reference void ratio(Γ)</td>
              <td><input type="number"></td>
            </tr>
            <tr>
              <td>CSL slope(λ)</td>
              <td><input type="number"></td>
            </tr>
          </table>
        <p class="sidebar__eyebrow">Plasticity</p>
          <table class="sidebar__table">
            <tr>
              <td>Critical friction ratio(M)</td>
              <td><input type="number"></td>
            </tr>
            <tr>
              <td>Volumetric coupling parameter(N)</td>
              <td><input type="number"></td>
            </tr>
            <tr>
              <td>Plastic hardening modulus(H)</td>
              <td><input type="number"></td>
            </tr>
            <tr>
              <td>Dilatancy constant(χ<sub>tc</sub>)</td>
              <td><input type="number"></td>
            </tr>
          </table>
        <p class="sidebar__eyebrow">Elasticity</p>
          <table class="sidebar__table">
            <tr>
              <td>Soil rigidity constant(I<sub>r</sub>)</td>
              <td><input type="number"></td>
            </tr>
            <tr>
              <td>Poisson’s ratio(ν)</td>
              <td><input type="number"></td>
            </tr>
            <tr>
          </table>
      </form>        
      </nav>
    </aside>

    <main class="content">
        
      

    </main>
  </div>

</body>
</html>
